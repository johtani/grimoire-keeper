services:
  web:
    image: nginx:alpine@sha256:a9ae6f6d078d477e21323310498e5196cb2b7c0aedd9e07b7306612077227d7c
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - ./apps/web/static:/usr/share/nginx/html
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - grimoire-network

  bot:
    build:
      context: .
      dockerfile: ./apps/bot/Dockerfile.prod
    environment:
      - PYTHONPATH=/app
      - BACKEND_API_URL=http://api:8000
      - SLACK_BOT_TOKEN=${GRIMOIRE_KEEPER_SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${GRIMOIRE_KEEPER_SLACK_SIGNING_SECRET}
      - SLACK_APP_TOKEN=${GRIMOIRE_KEEPER_SLACK_APP_TOKEN}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - grimoire-network

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.prod
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /opt/grimoire-keeper-data/database:/data
      - /opt/grimoire-keeper-data/json:/app/apps/api/data/json
    environment:
      - PYTHONPATH=/app
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
      - DATABASE_PATH=/data/grimoire.db
      - JSON_STORAGE_PATH=/app/apps/api/data/json
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - grimoire-network

  worker:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.prod
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    command: ["python", "-m", "grimoire_api.worker"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "grimoire_api.worker_health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    volumes:
      - /opt/grimoire-keeper-data/database:/data
      - /opt/grimoire-keeper-data/json:/app/apps/api/data/json
    environment:
      - PYTHONPATH=/app
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
      - DATABASE_PATH=/data/grimoire.db
      - JSON_STORAGE_PATH=/app/apps/api/data/json
      - OPENAI_API_KEY=${GRIMOIRE_KEEPER_OPENAI_API_KEY}
      - JINA_API_KEY=${GRIMOIRE_KEEPER_JINA_API_KEY}
      - LLM_API_KEY=${GRIMOIRE_KEEPER_LLM_API_KEY}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      weaviate:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - grimoire-network

  weaviate:
    image: ${WEAVIATE_IMAGE:-cr.weaviate.io/semitechnologies/weaviate:1.38.8}
    ports:
      - "127.0.0.1:8089:8080"
      - "127.0.0.1:50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai'
      ENABLE_MODULES: 'text2vec-openai'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - ${WEAVIATE_DATA_PATH:-/opt/grimoire-keeper-data/weaviate-1.38.8}:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - grimoire-network



networks:
  grimoire-network:
    driver: bridge
