services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:3.13
    security_opt:
      - seccomp=unconfined
    volumes:
      - ..:/workspace:cached
      - bash_history:/commandhistory
    working_dir: /workspace
    command: sleep infinity
    environment:
      PYTHONPATH: /workspace
      DATABASE_PATH: /workspace/grimoire.db
      JSON_STORAGE_PATH: /workspace/apps/api/data/json
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: 8080
      LLM_API_BASE: http://host.docker.internal:8080/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - grimoire-network

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.8
    ports:
      - "127.0.0.1:8089:8080"
      - "127.0.0.1:50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai'
      ENABLE_MODULES: 'text2vec-openai'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_1_38_8_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - grimoire-network

volumes:
  weaviate_1_38_8_data:
  bash_history:

networks:
  grimoire-network:
    driver: bridge
