name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Collect all Python tests together
        run: uv run pytest --collect-only -q

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy .

  api-unit-test:
    name: API Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run API unit tests
        run: >-
          uv run pytest apps/api/tests/unit/ -v
          --cov=grimoire_api
          --cov-report=term-missing
          --cov-report=xml:coverage-api.xml
          --cov-fail-under=80

  bot-unit-test:
    name: Bot Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run Bot unit tests
        run: >-
          uv run pytest apps/bot/tests/ -v
          --cov=grimoire_bot
          --cov-report=term-missing
          --cov-report=xml:coverage-bot.xml
          --cov-fail-under=65

  shared-unit-test:
    name: Shared Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run shared unit tests
        run: >-
          uv run pytest shared/tests/ -v
          --cov=grimoire_shared
          --cov-report=term-missing
          --cov-report=xml:coverage-shared.xml
          --cov-fail-under=90

  api-integration-test:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run integration tests without external services
        run: >-
          uv run pytest apps/api/tests/integration/ -v
          -m "integration and not weaviate"

  weaviate-integration-test:
    name: Weaviate Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.38.8
        ports:
          - 8080:8080
          - 50051:50051
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: text2vec-openai
          ENABLE_MODULES: text2vec-openai
          CLUSTER_HOSTNAME: node1
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8080/v1/.well-known/ready"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run Weaviate integration tests
        env:
          WEAVIATE_INTEGRATION: "1"
          WEAVIATE_EMBEDDING_MODEL: text-embedding-3-small
          WEAVIATE_EMBEDDING_DIMENSIONS: "1536"
        run: >-
          uv run pytest apps/api/tests/integration/ -v
          -m weaviate

  production-image-test:
    name: Production Image Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file apps/api/Dockerfile.prod --tag grimoire-api:smoke .

      - name: Smoke test API image
        run: >-
          docker run --rm --entrypoint python grimoire-api:smoke -c
          "import importlib.util, shutil;
          import grimoire_api, grimoire_shared;
          assert importlib.util.find_spec('pytest') is None;
          assert importlib.util.find_spec('ruff') is None;
          assert shutil.which('uv') is None"

      - name: Build Bot image
        run: docker build --file apps/bot/Dockerfile.prod --tag grimoire-bot:smoke .

      - name: Smoke test Bot image
        run: >-
          docker run --rm --entrypoint python grimoire-bot:smoke -c
          "import importlib.util, shutil;
          import grimoire_bot, grimoire_shared;
          assert importlib.util.find_spec('pytest') is None;
          assert importlib.util.find_spec('ruff') is None;
          assert shutil.which('uv') is None"

      - name: Verify lockfile mismatch fails the build
        shell: bash
        run: |
          cp apps/api/pyproject.toml /tmp/api-pyproject.toml
          trap 'cp /tmp/api-pyproject.toml apps/api/pyproject.toml' EXIT
          sed -i '/dependencies = \[/a\    "lockfile-mismatch-test==0",' apps/api/pyproject.toml
          if docker build --file apps/api/Dockerfile.prod .; then
            echo "ERROR: build succeeded with a stale uv.lock"
            exit 1
          fi

  web-test:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run web tests
        run: node --test apps/web/tests/*.test.js
